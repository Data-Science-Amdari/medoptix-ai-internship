name: Continuous Integration

on:
  push:
    branches: [medoptix_ai_project_ib]
  pull_request:
    branches: [medoptix_ai_project_ib]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # Add your test commands here, for example:
          # pytest tests/ --verbose
          # or if you don't have tests yet:
          python -c "print('Tests placeholder - add your tests here')"

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    ## Only build on push to main branch, not on PRs
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medoptix-api:latest
            ${{ secrets.DOCKER_USERNAME }}/medoptix-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/medoptix-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/medoptix-api:buildcache,mode=max

      - name: Image digest
        run: echo "Image built and pushed successfully"
