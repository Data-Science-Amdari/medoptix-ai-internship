name: Deploy to EC2

on:
  push:
    branches: [medoptix_ai_project_ib]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    ## Only deploy after CI passes
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-name: 'build-and-push'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
        if: github.event_name == 'push'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e  # Exit on any error
            
            echo "=== Starting deployment ==="
            
            # Install docker and docker-compose if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker $USER
            fi
            
            # Create directories if they do not exist
            mkdir -p /home/ubuntu/medoptix-api
            cd /home/ubuntu/medoptix-api
            
            # Pull the latest code
            echo "=== Pulling latest code ==="
            if [ -d ".git" ]; then
              git fetch origin
              git checkout medoptix_ai_project_ib
              git pull origin medoptix_ai_project_ib
            else
              git clone -b medoptix_ai_project_ib https://github.com/${{ github.repository }}.git .
            fi
            
            # Pull the latest docker image
            echo "=== Pulling Docker image ==="
            docker pull ${{ secrets.DOCKER_USERNAME }}/medoptix-api:latest
            
            # Stop existing containers gracefully
            echo "=== Stopping existing containers ==="
            docker-compose down || true
            
            # Start the docker compose
            echo "=== Starting new containers ==="
            docker-compose up -d --build
            
            # Wait for service to be ready
            echo "=== Waiting for service to start ==="
            sleep 30
            
            # Health check with retry
            echo "=== Running health check ==="
            MAX_RETRIES=5
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:8000/health; then
                echo "Health check passed!"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Health check failed, retrying... ($RETRY_COUNT/$MAX_RETRIES)"
                  sleep 10
                else
                  echo "Health check failed after $MAX_RETRIES attempts"
                  echo "=== Rolling back ==="
                  docker-compose down
                  exit 1
                fi
              fi
            done
            
            # Cleanup old images
            echo "=== Cleaning up old Docker images ==="
            docker image prune -f
            
            echo "=== Deployment successful! ==="

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment failed"
          fi

